<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proofing Room Inventory - Brandpack Tools</title>
    <link rel="stylesheet" href="../../shared/styles/theme.css">
    <link rel="stylesheet" href="../../shared/styles/base.css">
    <link rel="stylesheet" href="../../shared/styles/components.css">
    <style>
        body {
            min-height: 100vh;
            padding: 0;
        }

        .inventory-header {
            background: var(--color-bg-card);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: sticky;
            top: 0;
            z-index: 50;
            padding: var(--spacing-lg) var(--spacing-xl);
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--spacing-md);
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
        }

        .header-icon {
            width: 40px;
            height: 40px;
            background: var(--gradient-primary);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .header-buttons {
            display: flex;
            gap: var(--spacing-sm);
            flex-wrap: wrap;
        }

        .btn-view {
            padding: var(--spacing-sm) var(--spacing-md);
            border-radius: var(--radius-md);
            font-weight: 500;
            transition: all var(--transition-base);
            background: var(--color-bg-card);
            color: var(--color-text-secondary);
            border: none;
            cursor: pointer;
        }

        .btn-view.active {
            background: var(--gradient-primary);
            color: white;
            box-shadow: var(--shadow-md);
        }

        .btn-view:hover:not(.active) {
            background: var(--color-bg-hover);
        }

        .inventory-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: var(--spacing-xl);
        }

        .printer-selector {
            background: var(--gradient-card);
            border-radius: var(--radius-xl);
            padding: var(--spacing-lg);
            margin-bottom: var(--spacing-xl);
        }

        .printer-selector label {
            font-size: var(--text-lg);
            font-weight: 600;
            color: var(--color-text-primary);
            margin-right: var(--spacing-md);
        }

        .printer-selector select {
            flex: 1;
            max-width: 400px;
            padding: var(--spacing-sm) var(--spacing-md);
            font-size: var(--text-lg);
            font-weight: 500;
        }

        .info-banner {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: var(--radius-lg);
            padding: var(--spacing-md);
            margin-bottom: var(--spacing-xl);
            display: flex;
            gap: var(--spacing-md);
        }

        .info-banner-icon {
            color: #60a5fa;
            font-size: var(--text-xl);
        }

        .category-section {
            background: var(--gradient-card);
            border-radius: var(--radius-xl);
            overflow: hidden;
            margin-bottom: var(--spacing-lg);
        }

        .category-header {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.02));
            padding: var(--spacing-md) var(--spacing-lg);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .category-title {
            font-size: var(--text-xl);
            font-weight: 700;
            font-family: var(--font-display);
            color: var(--color-primary-light);
        }

        .category-subtitle {
            font-size: var(--text-xs);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--color-text-muted);
            margin-bottom: var(--spacing-md);
        }

        .category-content {
            padding: var(--spacing-lg);
        }

        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: var(--spacing-md);
        }

        .item-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-md);
            padding: var(--spacing-md);
            transition: all var(--transition-base);
        }

        .item-card:hover {
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: var(--spacing-md);
        }

        .item-info h4 {
            font-size: var(--text-base);
            font-weight: 600;
            color: var(--color-text-primary);
            margin-bottom: var(--spacing-xs);
        }

        .item-info p {
            font-size: var(--text-sm);
            color: var(--color-text-muted);
            margin: 0;
        }

        .stock-badge {
            padding: var(--spacing-xs) var(--spacing-sm);
            border-radius: var(--radius-sm);
            font-size: var(--text-sm);
            font-weight: 600;
            border: 1px solid;
        }

        .stock-empty {
            background: rgba(239, 68, 68, 0.1);
            color: #f87171;
            border-color: rgba(239, 68, 68, 0.3);
        }

        .stock-low {
            background: rgba(245, 158, 11, 0.1);
            color: #fbbf24;
            border-color: rgba(245, 158, 11, 0.3);
        }

        .stock-good {
            background: rgba(16, 185, 129, 0.1);
            color: #34d399;
            border-color: rgba(16, 185, 129, 0.3);
        }

        .item-controls {
            display: flex;
            gap: var(--spacing-sm);
            align-items: center;
            margin-top: var(--spacing-md);
        }

        .stock-btn {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-sm);
            border: none;
            font-size: var(--text-xl);
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-fast);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stock-btn-minus {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
        }

        .stock-btn-minus:hover {
            background: rgba(239, 68, 68, 0.3);
        }

        .stock-btn-plus {
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
        }

        .stock-btn-plus:hover {
            background: rgba(16, 185, 129, 0.3);
        }

        .stock-display {
            flex: 1;
            text-align: center;
            font-size: var(--text-2xl);
            font-weight: 700;
            font-family: var(--font-mono);
            color: var(--color-text-primary);
        }

        .btn-delete {
            width: 36px;
            height: 36px;
            background: rgba(239, 68, 68, 0.1);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: var(--text-lg);
            transition: all var(--transition-fast);
        }

        .btn-delete:hover {
            background: rgba(239, 68, 68, 0.2);
        }

        .stats-container {
            display: grid;
            gap: var(--spacing-lg);
        }

        .stats-table {
            width: 100%;
            background: var(--gradient-card);
            border-radius: var(--radius-xl);
            overflow: hidden;
        }

        .stats-table th {
            background: rgba(255, 255, 255, 0.05);
            padding: var(--spacing-md);
            text-align: left;
            font-weight: 600;
            color: var(--color-text-secondary);
        }

        .stats-table td {
            padding: var(--spacing-md);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .stats-filter {
            margin-bottom: var(--spacing-lg);
        }

        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                align-items: stretch;
            }

            .header-buttons {
                justify-content: center;
            }

            .items-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div id="root">
        <div style="display: flex; align-items: center; justify-content: center; min-height: 100vh; color: var(--color-primary-light);">
            <div style="text-align: center;">
                <div style="font-size: 24px; margin-bottom: 10px;">⏳</div>
                <div style="font-size: 18px;">Loading inventory system...</div>
            </div>
        </div>
    </div>

    <script type="module" src="./inventory.js"></script>
</body>
</html>
