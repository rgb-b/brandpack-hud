<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proofing Room Maintenance Tracker - Brandpack Tools</title>
    <link rel="stylesheet" href="../../shared/styles/theme.css">
    <link rel="stylesheet" href="../../shared/styles/base.css">
    <link rel="stylesheet" href="../../shared/styles/components.css">
    <style>
        body {
            min-height: 100vh;
            padding: 0;
        }

        .maintenance-header {
            background: var(--color-bg-card);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: sticky;
            top: 0;
            z-index: 50;
            padding: var(--spacing-lg) var(--spacing-xl);
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: var(--spacing-md);
        }

        .header-title h1 {
            font-size: var(--text-2xl);
            margin: 0 0 var(--spacing-xs) 0;
        }

        .header-date {
            color: var(--color-text-muted);
            font-size: var(--text-sm);
        }

        .maintenance-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: var(--spacing-xl);
        }

        /* Tabs */
        .tabs-nav {
            display: flex;
            gap: var(--spacing-sm);
            margin-bottom: var(--spacing-xl);
            flex-wrap: wrap;
            background: var(--gradient-card);
            padding: var(--spacing-md);
            border-radius: var(--radius-lg);
        }

        .nav-tab {
            padding: var(--spacing-sm) var(--spacing-md);
            border-radius: var(--radius-md);
            background: rgba(255, 255, 255, 0.03);
            color: var(--color-text-secondary);
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            font-weight: 500;
            transition: all var(--transition-base);
        }

        .nav-tab:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .nav-tab.active {
            background: var(--gradient-primary);
            color: white;
            border-color: transparent;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Progress */
        .progress-section {
            background: var(--gradient-card);
            border-radius: var(--radius-xl);
            padding: var(--spacing-lg);
            margin-bottom: var(--spacing-lg);
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: var(--spacing-md);
        }

        .progress-bar-container {
            height: 24px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: var(--radius-md);
            overflow: hidden;
            margin-bottom: var(--spacing-md);
        }

        .progress-bar-fill {
            height: 100%;
            background: var(--gradient-primary);
            transition: width var(--transition-slow);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: var(--text-sm);
            font-weight: 600;
        }

        /* Checklist */
        .checklist-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-md);
            padding: var(--spacing-md);
            margin-bottom: var(--spacing-sm);
            display: flex;
            align-items: start;
            gap: var(--spacing-md);
            transition: all var(--transition-base);
            cursor: pointer;
        }

        .checklist-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .checklist-item.completed {
            opacity: 0.6;
        }

        .checklist-checkbox {
            width: 24px;
            height: 24px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: var(--radius-sm);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition-fast);
        }

        .checklist-item.completed .checklist-checkbox {
            background: var(--gradient-primary);
            border-color: transparent;
        }

        .checklist-checkbox::after {
            content: '✓';
            color: white;
            font-size: var(--text-lg);
            opacity: 0;
            transition: opacity var(--transition-fast);
        }

        .checklist-item.completed .checklist-checkbox::after {
            opacity: 1;
        }

        .checklist-content {
            flex: 1;
        }

        .checklist-text {
            font-weight: 500;
            margin-bottom: var(--spacing-xs);
        }

        .checklist-details {
            font-size: var(--text-sm);
            color: var(--color-text-muted);
        }

        /* Issue Card */
        .issue-card {
            background: var(--gradient-card);
            border-radius: var(--radius-lg);
            padding: var(--spacing-lg);
            margin-bottom: var(--spacing-md);
            border-left: 4px solid;
        }

        .issue-card.minor {
            border-left-color: var(--color-success);
        }

        .issue-card.moderate {
            border-left-color: var(--color-warning);
        }

        .issue-card.major {
            border-left-color: var(--color-error);
        }

        .issue-card.critical {
            border-left-color: #dc2626;
        }

        .issue-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: var(--spacing-md);
        }

        .issue-title {
            font-size: var(--text-lg);
            font-weight: 600;
            margin-bottom: var(--spacing-xs);
        }

        .issue-meta {
            font-size: var(--text-sm);
            color: var(--color-text-muted);
        }

        .issue-badges {
            display: flex;
            gap: var(--spacing-sm);
            flex-wrap: wrap;
        }

        .severity-badge {
            padding: var(--spacing-xs) var(--spacing-sm);
            border-radius: var(--radius-sm);
            font-size: var(--text-xs);
            font-weight: 600;
            text-transform: uppercase;
        }

        .severity-badge.minor {
            background: rgba(16, 185, 129, 0.1);
            color: var(--color-success);
        }

        .severity-badge.moderate {
            background: rgba(245, 158, 11, 0.1);
            color: var(--color-warning);
        }

        .severity-badge.major {
            background: rgba(239, 68, 68, 0.1);
            color: var(--color-error);
        }

        .severity-badge.critical {
            background: rgba(220, 38, 38, 0.1);
            color: #dc2626;
        }

        .status-badge {
            padding: var(--spacing-xs) var(--spacing-sm);
            border-radius: var(--radius-sm);
            font-size: var(--text-xs);
            font-weight: 600;
        }

        .status-badge.in-progress {
            background: rgba(59, 130, 246, 0.1);
            color: #60a5fa;
        }

        .status-badge.resolved {
            background: rgba(16, 185, 129, 0.1);
            color: var(--color-success);
        }

        .issue-details {
            margin-bottom: var(--spacing-md);
        }

        .issue-section {
            margin-bottom: var(--spacing-sm);
        }

        .issue-label {
            font-weight: 600;
            color: var(--color-text-secondary);
            margin-bottom: var(--spacing-xs);
        }

        .issue-photos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: var(--spacing-sm);
            margin-top: var(--spacing-sm);
        }

        .issue-photo {
            width: 100%;
            height: 100px;
            object-fit: cover;
            border-radius: var(--radius-sm);
            cursor: pointer;
        }

        /* Filters */
        .filters-section {
            background: var(--gradient-card);
            border-radius: var(--radius-lg);
            padding: var(--spacing-md);
            margin-bottom: var(--spacing-lg);
            display: flex;
            gap: var(--spacing-md);
            flex-wrap: wrap;
        }

        /* Maintenance Tasks */
        .maintenance-procedure {
            background: var(--gradient-card);
            border-radius: var(--radius-lg);
            padding: var(--spacing-lg);
            margin-bottom: var(--spacing-lg);
        }

        .procedure-step {
            padding: var(--spacing-md);
            border-left: 3px solid rgba(255, 255, 255, 0.1);
            margin-bottom: var(--spacing-sm);
        }

        .procedure-step strong {
            color: var(--color-primary-light);
        }

        .recurring-task {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-md);
            padding: var(--spacing-md);
            margin-bottom: var(--spacing-sm);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .recurring-task.overdue {
            border-color: var(--color-error);
            background: rgba(239, 68, 68, 0.05);
        }

        /* Tech Visits */
        .visit-card {
            background: var(--gradient-card);
            border-radius: var(--radius-lg);
            padding: var(--spacing-lg);
            margin-bottom: var(--spacing-md);
        }

        .visit-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: var(--spacing-sm);
        }

        /* Analytics */
        .analytics-controls {
            display: flex;
            gap: var(--spacing-sm);
            margin-bottom: var(--spacing-lg);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-lg);
        }

        .chart-section {
            background: var(--gradient-card);
            border-radius: var(--radius-lg);
            padding: var(--spacing-lg);
            margin-bottom: var(--spacing-lg);
        }

        .chart-title {
            font-size: var(--text-lg);
            font-weight: 600;
            margin-bottom: var(--spacing-md);
            color: var(--color-primary-light);
        }

        .chart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--spacing-sm);
            margin-bottom: var(--spacing-xs);
            background: rgba(255, 255, 255, 0.03);
            border-radius: var(--radius-sm);
        }

        /* Modal styles */
        .photo-preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: var(--spacing-sm);
            margin-top: var(--spacing-sm);
        }

        .photo-preview {
            position: relative;
            width: 100%;
            height: 80px;
        }

        .photo-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: var(--radius-sm);
        }

        .photo-remove {
            position: absolute;
            top: -8px;
            right: -8px;
            width: 24px;
            height: 24px;
            background: var(--color-error);
            color: white;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-size: var(--text-xs);
        }

        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                align-items: stretch;
            }

            .filters-section {
                flex-direction: column;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="maintenance-header">
        <div class="header-content">
            <div class="header-title">
                <h1>🔧 Proofing Room Maintenance</h1>
                <div class="header-date" id="currentDate"></div>
            </div>
            <div>
                <a href="launcher.html" class="btn btn-secondary">← Back</a>
            </div>
        </div>
    </div>

    <div class="maintenance-container">
        <!-- Tabs Navigation -->
        <div class="tabs-nav">
            <button class="nav-tab active" onclick="window.maintenanceApp.switchTab('today')">📅 Today</button>
            <button class="nav-tab" onclick="window.maintenanceApp.switchTab('issues')">🔴 Issues</button>
            <button class="nav-tab" onclick="window.maintenanceApp.switchTab('maintenance')">⚙️ Maintenance</button>
            <button class="nav-tab" onclick="window.maintenanceApp.switchTab('calendar')">📆 Tech Visits</button>
            <button class="nav-tab" onclick="window.maintenanceApp.switchTab('analytics')">📊 Analytics</button>
        </div>

        <!-- Today Tab -->
        <div id="tab-today" class="tab-content active">
            <!-- Progress -->
            <div class="progress-section">
                <div class="progress-header">
                    <h2>Daily Checklist Progress</h2>
                    <button class="btn btn-secondary btn-small" onclick="window.maintenanceApp.resetChecklist()">Reset</button>
                </div>
                <div class="progress-bar-container">
                    <div class="progress-bar-fill" id="progressBar">0%</div>
                </div>
            </div>

            <!-- Checklist -->
            <div id="dailyChecklist"></div>

            <!-- Today's Issues -->
            <div style="margin-top: var(--spacing-xl);">
                <h2 style="margin-bottom: var(--spacing-md);">Today's Issues</h2>
                <div id="todayIssues"></div>
            </div>

            <!-- Reminders -->
            <div id="remindersSection"></div>
        </div>

        <!-- Issues Tab -->
        <div id="tab-issues" class="tab-content">
            <div style="display: flex; justify-content: space-between; margin-bottom: var(--spacing-lg);">
                <h2>Issue History</h2>
                <button class="btn btn-primary" onclick="window.maintenanceApp.openIssueModal()">+ Log New Issue</button>
            </div>

            <div class="filters-section">
                <select id="machineFilter" class="form-select" onchange="window.maintenanceApp.filterIssues()">
                    <option value="all">All Machines</option>
                </select>
                <select id="statusFilter" class="form-select" onchange="window.maintenanceApp.filterIssues()">
                    <option value="all">All Statuses</option>
                    <option value="in-progress">In Progress</option>
                    <option value="resolved">Resolved</option>
                </select>
            </div>

            <div id="issuesList"></div>
        </div>

        <!-- Maintenance Tab -->
        <div id="tab-maintenance" class="tab-content">
            <h2 style="margin-bottom: var(--spacing-lg);">Weekly Maintenance Tasks</h2>
            <div id="weeklyMaintenance"></div>

            <h2 style="margin-top: var(--spacing-2xl); margin-bottom: var(--spacing-lg);">Recurring Tasks</h2>
            <div id="recurringTasks"></div>
        </div>

        <!-- Calendar Tab -->
        <div id="tab-calendar" class="tab-content">
            <div style="display: flex; justify-content: space-between; margin-bottom: var(--spacing-lg);">
                <h2>Technician Visits</h2>
                <button class="btn btn-primary" onclick="window.maintenanceApp.openVisitModal()">+ Schedule Visit</button>
            </div>

            <div id="techVisitsList"></div>
        </div>

        <!-- Analytics Tab -->
        <div id="tab-analytics" class="tab-content">
            <h2 style="margin-bottom: var(--spacing-lg);">Maintenance Analytics</h2>

            <div class="analytics-controls">
                <button class="btn btn-secondary" onclick="window.maintenanceApp.setAnalyticsPeriod('week')">Week</button>
                <button class="btn btn-secondary active" onclick="window.maintenanceApp.setAnalyticsPeriod('month')">Month</button>
                <button class="btn btn-secondary" onclick="window.maintenanceApp.setAnalyticsPeriod('all')">All Time</button>
            </div>

            <div id="analyticsContent"></div>
        </div>
    </div>

    <!-- Issue Modal -->
    <div id="issueModal" class="modal" style="display: none;">
        <div class="modal-content modal-lg">
            <div class="modal-header">
                <h2>Log New Issue</h2>
                <button class="modal-close" onclick="window.maintenanceApp.closeIssueModal()">×</button>
            </div>
            <div class="modal-body">
                <form id="issueForm" onsubmit="window.maintenanceApp.submitIssue(event)">
                    <!-- Form content will be populated by JavaScript -->
                </form>
            </div>
        </div>
    </div>

    <!-- Visit Modal -->
    <div id="visitModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Schedule Technician Visit</h2>
                <button class="modal-close" onclick="window.maintenanceApp.closeVisitModal()">×</button>
            </div>
            <div class="modal-body">
                <form id="visitForm" onsubmit="window.maintenanceApp.submitVisit(event)">
                    <!-- Form content will be populated by JavaScript -->
                </form>
            </div>
        </div>
    </div>

    <script type="module" src="./maintenance.js"></script>
</body>
</html>
