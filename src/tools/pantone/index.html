<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roland Pantone Color Tracker - Brandpack Tools</title>
    <link rel="stylesheet" href="../../shared/styles/theme.css">
    <link rel="stylesheet" href="../../shared/styles/base.css">
    <link rel="stylesheet" href="../../shared/styles/components.css">
    <style>
        body {
            min-height: 100vh;
            padding: 0;
        }

        .pantone-header {
            background: var(--color-bg-card);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: sticky;
            top: 0;
            z-index: 50;
            padding: var(--spacing-lg) var(--spacing-xl);
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--spacing-md);
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
        }

        .header-icon {
            width: 40px;
            height: 40px;
            background: var(--gradient-primary);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .pantone-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: var(--spacing-xl);
        }

        /* Setup Section */
        .setup-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 60vh;
        }

        .upload-zone {
            width: 100%;
            max-width: 500px;
            padding: var(--spacing-2xl);
            background: var(--gradient-card);
            border: 2px dashed rgba(255, 255, 255, 0.2);
            border-radius: var(--radius-xl);
            text-align: center;
            transition: all var(--transition-base);
            cursor: pointer;
        }

        .upload-zone:hover,
        .upload-zone.dragover {
            border-color: var(--color-primary-light);
            background: rgba(255, 140, 66, 0.05);
        }

        .upload-icon {
            font-size: 64px;
            margin-bottom: var(--spacing-md);
        }

        .upload-text {
            font-size: var(--text-lg);
            font-weight: 600;
            margin-bottom: var(--spacing-sm);
        }

        .upload-hint {
            font-size: var(--text-sm);
            color: var(--color-text-muted);
        }

        /* App Section */
        .app-section {
            display: none;
        }

        .app-section.active {
            display: block;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-xl);
        }

        /* Actions */
        .actions-bar {
            display: flex;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-xl);
            flex-wrap: wrap;
        }

        /* Search Bar */
        .search-bar {
            width: 100%;
            padding: var(--spacing-md);
            background: var(--color-bg-card);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-md);
            color: var(--color-text-primary);
            font-size: var(--text-base);
            margin-bottom: var(--spacing-md);
            transition: all var(--transition-base);
        }

        .search-bar:focus {
            outline: none;
            border-color: var(--color-primary-light);
        }

        textarea.search-bar {
            min-height: 150px;
            font-family: var(--font-mono);
            resize: vertical;
        }

        /* Filter Tabs */
        .filter-tabs {
            display: flex;
            gap: var(--spacing-sm);
            margin-bottom: var(--spacing-lg);
            flex-wrap: wrap;
        }

        .filter-tab {
            padding: var(--spacing-sm) var(--spacing-md);
            border-radius: var(--radius-md);
            font-weight: 500;
            transition: all var(--transition-base);
            background: var(--color-bg-card);
            color: var(--color-text-secondary);
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
        }

        .filter-tab.active {
            background: var(--gradient-primary);
            color: white;
            border-color: transparent;
        }

        .filter-tab:hover:not(.active) {
            background: var(--color-bg-hover);
        }

        /* Color List */
        .color-list {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
        }

        .color-item {
            background: var(--gradient-card);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-md);
            padding: var(--spacing-md);
            display: flex;
            justify-content: space-between;
            align-items: start;
            gap: var(--spacing-md);
            transition: all var(--transition-base);
        }

        .color-item:hover {
            border-color: rgba(255, 255, 255, 0.2);
        }

        .color-item.matched {
            border-left: 4px solid var(--color-success);
        }

        .color-item.not-matched {
            border-left: 4px solid var(--color-error);
        }

        .color-item.old-match {
            border-left: 4px solid var(--color-warning);
        }

        .color-info {
            flex: 1;
        }

        .color-name {
            font-size: var(--text-lg);
            font-weight: 600;
            color: var(--color-text-primary);
            margin-bottom: var(--spacing-xs);
        }

        .color-meta {
            font-size: var(--text-sm);
            color: var(--color-text-muted);
            margin-bottom: var(--spacing-xs);
        }

        .warning-box {
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: var(--radius-sm);
            padding: var(--spacing-sm);
            font-size: var(--text-sm);
            color: var(--color-warning);
            margin-top: var(--spacing-sm);
        }

        .warning-box.error {
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.3);
            color: var(--color-error);
        }

        .color-status {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: var(--spacing-sm);
        }

        .status-badge {
            padding: var(--spacing-xs) var(--spacing-sm);
            border-radius: var(--radius-sm);
            font-size: var(--text-sm);
            font-weight: 600;
            white-space: nowrap;
        }

        .status-badge.matched {
            background: rgba(16, 185, 129, 0.1);
            color: var(--color-success);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .status-badge.not-matched {
            background: rgba(239, 68, 68, 0.1);
            color: var(--color-error);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .status-badge.old-match {
            background: rgba(245, 158, 11, 0.1);
            color: var(--color-warning);
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        /* Multi Results */
        .multi-summary {
            background: var(--color-bg-card);
            border-radius: var(--radius-md);
            padding: var(--spacing-lg);
            margin-bottom: var(--spacing-lg);
        }

        .multi-summary h3 {
            color: var(--color-primary-light);
            margin-bottom: var(--spacing-md);
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: var(--spacing-md);
        }

        .summary-item {
            text-align: center;
        }

        .summary-value {
            font-size: var(--text-2xl);
            font-weight: 700;
            font-family: var(--font-mono);
        }

        .summary-label {
            font-size: var(--text-sm);
            color: var(--color-text-muted);
        }

        /* Card styles */
        .pantone-card {
            background: var(--gradient-card);
            border-radius: var(--radius-xl);
            padding: var(--spacing-lg);
            margin-bottom: var(--spacing-lg);
        }

        .pantone-card.hidden {
            display: none;
        }

        .card-title {
            font-size: var(--text-xl);
            font-weight: 700;
            color: var(--color-primary-light);
            margin-bottom: var(--spacing-md);
        }

        .card-description {
            color: var(--color-text-muted);
            font-size: var(--text-sm);
            margin-bottom: var(--spacing-md);
        }

        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                align-items: stretch;
            }

            .actions-bar {
                flex-direction: column;
            }

            .color-item {
                flex-direction: column;
            }

            .color-status {
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="pantone-header">
        <div class="header-content">
            <div class="header-title">
                <div class="header-icon">🎨</div>
                <div>
                    <h1 style="font-size: var(--text-2xl); margin: 0;">Roland Pantone Tracker</h1>
                    <p style="color: var(--color-text-muted); font-size: var(--text-sm); margin: 0;">Track matched colors and dates</p>
                </div>
            </div>
            <div>
                <a href="../../index.html" class="btn btn-secondary">← Back</a>
            </div>
        </div>
    </div>

    <div class="pantone-container">
        <!-- Setup Section -->
        <div class="setup-section" id="setupSection">
            <div class="upload-zone" id="fileUpload" onclick="document.getElementById('fileInput').click()">
                <div class="upload-icon">📁</div>
                <div class="upload-text">Upload Pantone Data</div>
                <div class="upload-hint">Click or drag & drop pantone_data.json here</div>
                <input type="file" id="fileInput" accept=".json" style="display: none;" onchange="window.pantoneApp.loadDataFile(event)">
            </div>
        </div>

        <!-- App Section -->
        <div class="app-section" id="appSection">
            <!-- Stats -->
            <div class="stats-grid" id="statsSection"></div>

            <!-- Actions -->
            <div class="actions-bar">
                <button class="btn btn-primary" onclick="window.pantoneApp.showSingleSearch()">🔍 Search Single Color</button>
                <button class="btn btn-primary" onclick="window.pantoneApp.showMultiCheck()">📋 Check Multiple Colors</button>
                <button class="btn btn-secondary" onclick="window.pantoneApp.exportData()">💾 Export Updated Data</button>
                <button class="btn btn-secondary" onclick="window.pantoneApp.clearData()">🗑️ Clear & Reload</button>
            </div>

            <!-- Single Search Card -->
            <div class="pantone-card" id="singleSearchCard">
                <h2 class="card-title">🔍 Search Pantone Color</h2>
                <input type="text" class="search-bar" id="searchInput" placeholder="Type Pantone name (e.g., 185 C, Blue 072 C, etc.)" oninput="window.pantoneApp.searchColors()">

                <div class="filter-tabs">
                    <button class="filter-tab active" onclick="window.pantoneApp.filterResults('all', event)">All</button>
                    <button class="filter-tab" onclick="window.pantoneApp.filterResults('matched', event)">✅ Matched</button>
                    <button class="filter-tab" onclick="window.pantoneApp.filterResults('not-matched', event)">❌ Not Matched</button>
                    <button class="filter-tab" onclick="window.pantoneApp.filterResults('old-match', event)">⚠️ Old (5+ years)</button>
                </div>

                <div class="color-list" id="searchResults"></div>
            </div>

            <!-- Multi Check Card -->
            <div class="pantone-card hidden" id="multiCheckCard">
                <h2 class="card-title">📋 Check Multiple Colors</h2>
                <p class="card-description">
                    Paste a list of Pantone colors (one per line) to check their match status:
                </p>
                <textarea class="search-bar" id="multiInput" placeholder="Example:&#10;185 C&#10;300 C&#10;Blue 072 C&#10;Process Black C"></textarea>
                <button class="btn btn-primary" style="margin-top: var(--spacing-md);" onclick="window.pantoneApp.checkMultiple()">Check Colors</button>

                <div id="multiResults" style="margin-top: var(--spacing-lg);"></div>
            </div>
        </div>
    </div>

    <script>
// ============================================================================
// STORAGE UTILITIES
// ============================================================================
const storage = {
  get(key, defaultValue = null) {
    try {
      const item = localStorage.getItem(key)
      return item ? JSON.parse(item) : defaultValue
    } catch (error) {
      console.error(`Error reading ${key} from localStorage:`, error)
      return defaultValue
    }
  },

  set(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value))
      return true
    } catch (error) {
      console.error(`Error writing ${key} to localStorage:`, error)
      return false
    }
  },

  remove(key) {
    try {
      localStorage.removeItem(key)
      return true
    } catch (error) {
      console.error(`Error removing ${key} from localStorage:`, error)
      return false
    }
  },

  clear() {
    try {
      localStorage.clear()
      return true
    } catch (error) {
      console.error('Error clearing localStorage:', error)
      return false
    }
  },

  has(key) {
    return localStorage.getItem(key) !== null
  },

  keys() {
    return Object.keys(localStorage)
  }
}

// ============================================================================
// CONSTANTS
// ============================================================================
const STORAGE_KEYS = {
  // Inventory System
  INVENTORY: 'printer-inventory',
  USAGE_HISTORY: 'printer-usage-history',

  // Productivity Tracker
  TASKS: 'tasks',
  HISTORY: 'history',
  DAILY_TOTALS: 'dailyTotalsByDate',
  TASK_TOTALS: 'taskTotals',

  // Pantone Tracker
  PANTONE_COLORS: 'pantone-colors',

  // Maintenance Tracker
  MAINTENANCE: 'proofing-maintenance',

  // Dashboard / Launcher
  DASHBOARD_TODOS: 'dashboard-todos',
  DASHBOARD_ACTIVITY: 'dashboard-activity',

  // Master data (for export/import)
  MASTER_DATA: 'brandpack-tools-master'
}

// ============================================================================
// DATETIME UTILITIES
// ============================================================================
function formatDate(date, locale = 'en-AU', options = null) {
  // Handle string date input
  if (typeof date === 'string') {
    date = new Date(date)
  }

  // If no date provided, use current date
  if (!date) {
    date = new Date()
  }

  // If options provided, use toLocaleDateString
  if (options) {
    return date.toLocaleDateString(locale, options)
  }

  // Otherwise, return YYYY-MM-DD format
  const year = date.getFullYear()
  const month = String(date.getMonth() + 1).padStart(2, '0')
  const day = String(date.getDate()).padStart(2, '0')
  return `${year}-${month}-${day}`
}

function parseDate(dateString) {
  try {
    const date = new Date(dateString)
    return isNaN(date.getTime()) ? null : date
  } catch {
    return null
  }
}

function isOlderThanYears(dateString, years = 5) {
  const date = parseDate(dateString)
  if (!date) return false

  const yearsAgo = new Date()
  yearsAgo.setFullYear(yearsAgo.getFullYear() - years)
  return date < yearsAgo
}

// ============================================================================
// PANTONE TRACKER APPLICATION
// ============================================================================

// State
let pantoneData = []
let currentFilter = 'all'

// Initialize
function init() {
    loadFromStorage()
    setupDragDrop()
}

// Load data from localStorage
function loadFromStorage() {
    const saved = storage.get(STORAGE_KEYS.PANTONE_COLORS)
    if (saved && Array.isArray(saved)) {
        pantoneData = saved
        showApp()
    }
}

// Save data to localStorage
function saveToStorage() {
    storage.set(STORAGE_KEYS.PANTONE_COLORS, pantoneData)
}

// Setup drag and drop
function setupDragDrop() {
    const dropZone = document.getElementById('fileUpload')

    const preventDefaults = (e) => {
        e.preventDefault()
        e.stopPropagation()
    }

    ;['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, preventDefaults, false)
    })

    ;['dragenter', 'dragover'].forEach(eventName => {
        dropZone.addEventListener(eventName, () => {
            dropZone.classList.add('dragover')
        }, false)
    })

    ;['dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, () => {
            dropZone.classList.remove('dragover')
        }, false)
    })

    dropZone.addEventListener('drop', (e) => {
        const files = e.dataTransfer.files
        if (files.length > 0) {
            handleFile(files[0])
        }
    }, false)
}

// Load data file
function loadDataFile(event) {
    const file = event.target.files[0]
    if (file) {
        handleFile(file)
    }
}

// Handle file upload
function handleFile(file) {
    const reader = new FileReader()
    reader.onload = (e) => {
        try {
            const data = JSON.parse(e.target.result)
            if (!Array.isArray(data)) {
                throw new Error('Invalid data format')
            }
            pantoneData = data
            saveToStorage()
            showApp()
        } catch (error) {
            alert('Error loading file. Please make sure it\'s a valid JSON file.')
            console.error(error)
        }
    }
    reader.readAsText(file)
}

// Show app section
function showApp() {
    document.getElementById('setupSection').style.display = 'none'
    document.getElementById('appSection').classList.add('active')
    updateStats()
    searchColors()
}

// Get color status
function getColorStatus(color) {
    if (!color.date || color.date === '*' || color.date === 'CBW') {
        return 'not-matched'
    }

    try {
        const matchDate = new Date(color.date)
        if (isOlderThanYears(matchDate, 5)) {
            return 'old-match'
        }
        return 'matched'
    } catch (error) {
        return 'not-matched'
    }
}

// Update statistics
function updateStats() {
    const stats = {
        total: pantoneData.length,
        matched: 0,
        notMatched: 0,
        old: 0
    }

    pantoneData.forEach(color => {
        const status = getColorStatus(color)
        if (status === 'matched') stats.matched++
        else if (status === 'not-matched') stats.notMatched++
        else if (status === 'old-match') stats.old++
    })

    document.getElementById('statsSection').innerHTML = `
        <div class="stat-card">
            <div class="stat-value">${stats.total}</div>
            <div class="stat-label">Total Colors</div>
        </div>
        <div class="stat-card">
            <div class="stat-value">${stats.matched}</div>
            <div class="stat-label">✅ Matched</div>
        </div>
        <div class="stat-card">
            <div class="stat-value">${stats.notMatched}</div>
            <div class="stat-label">❌ Not Matched</div>
        </div>
        <div class="stat-card">
            <div class="stat-value">${stats.old}</div>
            <div class="stat-label">⚠️ Old (5+ years)</div>
        </div>
    `
}

// Show single search
function showSingleSearch() {
    document.getElementById('singleSearchCard').classList.remove('hidden')
    document.getElementById('multiCheckCard').classList.add('hidden')
}

// Show multi check
function showMultiCheck() {
    document.getElementById('singleSearchCard').classList.add('hidden')
    document.getElementById('multiCheckCard').classList.remove('hidden')
}

// Search colors
function searchColors() {
    const query = document.getElementById('searchInput').value.toLowerCase().trim()

    let filtered = pantoneData

    // Filter by search query
    if (query) {
        filtered = filtered.filter(color =>
            color.name.toLowerCase().includes(query)
        )
    }

    // Filter by status
    if (currentFilter !== 'all') {
        filtered = filtered.filter(color => getColorStatus(color) === currentFilter)
    }

    displayResults(filtered)
}

// Filter results
function filterResults(filter, event) {
    currentFilter = filter

    // Update active tab
    document.querySelectorAll('.filter-tab').forEach(tab => {
        tab.classList.remove('active')
    })
    if (event && event.target) {
        event.target.classList.add('active')
    }

    searchColors()
}

// Display results
function displayResults(colors) {
    const container = document.getElementById('searchResults')

    if (colors.length === 0) {
        container.innerHTML = '<p style="color: var(--color-text-muted); text-align: center; padding: 2rem;">No colors found</p>'
        return
    }

    container.innerHTML = colors.map((color, index) => {
        // Find the original index in pantoneData
        const originalIndex = pantoneData.indexOf(color)
        const status = getColorStatus(color)
        const statusText = {
            'matched': '✅ Matched',
            'not-matched': '❌ Not Matched',
            'old-match': '⚠️ Old Match'
        }

        let dateDisplay = ''
        if (color.date && color.date !== '*' && color.date !== 'CBW') {
            try {
                dateDisplay = formatDate(color.date, 'en-AU', {
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric'
                })
            } catch (error) {
                dateDisplay = color.date
            }
        }

        return `
            <div class="color-item ${status}">
                <div class="color-info">
                    <div class="color-name">${color.name}</div>
                    <div class="color-meta">
                        Sheet: ${color.sheet}
                        ${dateDisplay ? ` | Last matched: ${dateDisplay}` : ''}
                    </div>
                    ${status === 'old-match' ? `
                        <div class="warning-box">
                            ⚠️ This match is over 5 years old and may need re-matching
                        </div>
                    ` : ''}
                </div>
                <div class="color-status">
                    <span class="status-badge ${status}">${statusText[status]}</span>
                    <button class="btn btn-secondary btn-small" onclick="window.pantoneApp.markAsMatched(${originalIndex})">
                        ${status === 'not-matched' ? 'Mark Matched' : 'Update Date'}
                    </button>
                </div>
            </div>
        `
    }).join('')
}

// Mark color as matched
function markAsMatched(index) {
    const today = new Date().toISOString().split('T')[0]
    pantoneData[index].date = today
    saveToStorage()
    updateStats()
    searchColors()
}

// Check multiple colors
function checkMultiple() {
    const input = document.getElementById('multiInput').value
    const colorNames = input.split('\n')
        .map(line => line.trim())
        .filter(line => line.length > 0)

    if (colorNames.length === 0) {
        document.getElementById('multiResults').innerHTML = ''
        return
    }

    const results = colorNames.map(searchName => {
        // Normalize search - add PANTONE prefix if not present, ensure " C" suffix
        let normalizedSearch = searchName.toUpperCase()
        if (!normalizedSearch.startsWith('PANTONE')) {
            normalizedSearch = 'PANTONE ' + normalizedSearch
        }
        if (!normalizedSearch.endsWith(' C')) {
            normalizedSearch += ' C'
        }

        const found = pantoneData.find(color =>
            color.name.toUpperCase() === normalizedSearch ||
            color.name.toUpperCase().includes(searchName.toUpperCase())
        )

        return {
            searched: searchName,
            found: found,
            status: found ? getColorStatus(found) : 'not-found'
        }
    })

    const container = document.getElementById('multiResults')
    const summary = {
        total: results.length,
        matched: results.filter(r => r.status === 'matched').length,
        notMatched: results.filter(r => r.status === 'not-matched').length,
        old: results.filter(r => r.status === 'old-match').length,
        notFound: results.filter(r => r.status === 'not-found').length
    }

    container.innerHTML = `
        <div class="multi-summary">
            <h3>Summary</h3>
            <div class="summary-grid">
                <div class="summary-item">
                    <div class="summary-value">${summary.total}</div>
                    <div class="summary-label">Checked</div>
                </div>
                <div class="summary-item">
                    <div class="summary-value" style="color: var(--color-success);">${summary.matched}</div>
                    <div class="summary-label">Matched</div>
                </div>
                <div class="summary-item">
                    <div class="summary-value" style="color: var(--color-error);">${summary.notMatched}</div>
                    <div class="summary-label">Not Matched</div>
                </div>
                <div class="summary-item">
                    <div class="summary-value" style="color: var(--color-warning);">${summary.old}</div>
                    <div class="summary-label">Old</div>
                </div>
                ${summary.notFound > 0 ? `
                    <div class="summary-item">
                        <div class="summary-value" style="color: var(--color-error);">${summary.notFound}</div>
                        <div class="summary-label">Not Found</div>
                    </div>
                ` : ''}
            </div>
        </div>

        <div class="color-list">
            ${results.map(result => {
                if (!result.found) {
                    return `
                        <div class="color-item not-matched">
                            <div class="color-info">
                                <div class="color-name">${result.searched}</div>
                                <div class="warning-box error">
                                    ❌ Color not found in database
                                </div>
                            </div>
                        </div>
                    `
                }

                const status = result.status
                const statusText = {
                    'matched': '✅ Matched',
                    'not-matched': '❌ Not Matched',
                    'old-match': '⚠️ Old Match'
                }

                let dateDisplay = ''
                if (result.found.date && result.found.date !== '*' && result.found.date !== 'CBW') {
                    try {
                        dateDisplay = formatDate(result.found.date, 'en-AU', {
                            year: 'numeric',
                            month: 'short',
                            day: 'numeric'
                        })
                    } catch (error) {
                        dateDisplay = result.found.date
                    }
                }

                return `
                    <div class="color-item ${status}">
                        <div class="color-info">
                            <div class="color-name">${result.found.name}</div>
                            <div class="color-meta">
                                ${dateDisplay ? `Last matched: ${dateDisplay}` : 'Never matched'}
                            </div>
                            ${status === 'old-match' ? `
                                <div class="warning-box">
                                    ⚠️ Match is over 5 years old - consider re-matching
                                </div>
                            ` : ''}
                            ${status === 'not-matched' ? `
                                <div class="warning-box error">
                                    ❌ Not matched - needs color matching before printing
                                </div>
                            ` : ''}
                        </div>
                        <div class="color-status">
                            <span class="status-badge ${status}">${statusText[status]}</span>
                        </div>
                    </div>
                `
            }).join('')}
        </div>
    `
}

// Export data
function exportData() {
    const dataStr = JSON.stringify(pantoneData, null, 2)
    const dataBlob = new Blob([dataStr], { type: 'application/json' })
    const url = URL.createObjectURL(dataBlob)
    const link = document.createElement('a')
    const today = new Date().toISOString().split('T')[0]
    link.href = url
    link.download = `pantone_data_updated_${today}.json`
    document.body.appendChild(link)
    link.click()
    document.body.removeChild(link)
    URL.revokeObjectURL(url)

    alert('✓ Data exported! You can now update your Excel file with the new dates.')
}

// Clear data
function clearData() {
    if (confirm('Clear all data and reload? You\'ll need to re-upload the JSON file.')) {
        storage.remove(STORAGE_KEYS.PANTONE_COLORS)
        location.reload()
    }
}

// Initialize and expose API
function initApp() {
    init()

    // Expose API for event handlers
    window.pantoneApp = {
        loadDataFile,
        showSingleSearch,
        showMultiCheck,
        searchColors,
        filterResults,
        markAsMatched,
        checkMultiple,
        exportData,
        clearData
    }
}

// Run on DOM ready
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initApp)
} else {
    initApp()
}
    </script>
</body>
