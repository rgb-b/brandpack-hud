<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productivity Tracker - Brandpack Tools</title>
    <link rel="stylesheet" href="../../shared/styles/theme.css">
    <link rel="stylesheet" href="../../shared/styles/base.css">
    <link rel="stylesheet" href="../../shared/styles/components.css">
    <style>
        body {
            min-height: 100vh;
            padding: var(--spacing-xl);
        }

        .productivity-container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* Header */
        .productivity-header {
            text-align: center;
            margin-bottom: var(--spacing-2xl);
        }

        .productivity-header h1 {
            font-size: var(--text-5xl);
            font-weight: 700;
            background: linear-gradient(135deg, var(--color-available), var(--color-working), var(--color-unavailable));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: var(--spacing-sm);
        }

        .productivity-header p {
            color: var(--color-text-secondary);
        }

        /* Controls */
        .controls-section {
            background: var(--gradient-card);
            border-radius: var(--radius-xl);
            padding: var(--spacing-lg);
            margin-bottom: var(--spacing-xl);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .status-selector {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: var(--spacing-sm);
            margin-bottom: var(--spacing-md);
        }

        .status-btn {
            padding: var(--spacing-md);
            border: 2px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.03);
            color: var(--color-text-secondary);
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: 600;
            font-size: var(--text-sm);
            transition: all var(--transition-base);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .status-btn:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.05);
        }

        .status-btn.active.available {
            background: rgba(16, 185, 129, 0.1);
            border-color: var(--color-available);
            color: var(--color-available);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.3);
        }

        .status-btn.active.working {
            background: rgba(245, 158, 11, 0.1);
            border-color: var(--color-working);
            color: var(--color-working);
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.3);
        }

        .status-btn.active.unavailable {
            background: rgba(239, 68, 68, 0.1);
            border-color: var(--color-unavailable);
            color: var(--color-unavailable);
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.3);
        }

        .task-selector {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-sm);
        }

        .task-selector label {
            font-size: var(--text-sm);
            color: var(--color-text-muted);
        }

        .task-selector select {
            padding: var(--spacing-md);
            background: var(--color-bg-card);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-md);
            color: var(--color-text-primary);
            font-size: var(--text-base);
        }

        /* Timer Display */
        .timer-display {
            background: var(--gradient-card);
            border-radius: var(--radius-xl);
            padding: var(--spacing-2xl);
            text-align: center;
            margin-bottom: var(--spacing-xl);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .timer-status {
            font-size: var(--text-sm);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: var(--spacing-sm);
        }

        .timer-time {
            font-size: 4rem;
            font-weight: 700;
            font-family: var(--font-mono);
            margin-bottom: var(--spacing-sm);
            letter-spacing: 0.05em;
        }

        .timer-task {
            font-size: var(--text-lg);
            color: var(--color-text-secondary);
        }

        /* Summary Section */
        .summary-section {
            margin-bottom: var(--spacing-xl);
        }

        .summary-title {
            font-size: var(--text-xl);
            font-weight: 700;
            color: var(--color-text-primary);
            margin-bottom: var(--spacing-md);
        }

        .summary-cards {
            display: grid;
            gap: var(--spacing-md);
        }

        .summary-card {
            background: var(--gradient-card);
            border-radius: var(--radius-lg);
            padding: var(--spacing-lg);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .summary-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-md);
        }

        .summary-status {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            font-size: var(--text-lg);
            font-weight: 600;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .status-indicator.available {
            background: var(--color-available);
            box-shadow: 0 0 10px var(--color-available);
        }

        .status-indicator.working {
            background: var(--color-working);
            box-shadow: 0 0 10px var(--color-working);
        }

        .status-indicator.unavailable {
            background: var(--color-unavailable);
            box-shadow: 0 0 10px var(--color-unavailable);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .summary-percentage {
            font-size: var(--text-2xl);
            font-weight: 700;
            font-family: var(--font-mono);
        }

        .summary-progress {
            height: 8px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: var(--radius-sm);
            overflow: hidden;
            margin-bottom: var(--spacing-md);
        }

        .summary-progress-bar {
            height: 100%;
            transition: width var(--transition-slow);
        }

        .summary-progress-bar.available {
            background: linear-gradient(90deg, var(--color-available), #34d399);
        }

        .summary-progress-bar.working {
            background: linear-gradient(90deg, var(--color-working), #fbbf24);
        }

        .summary-progress-bar.unavailable {
            background: linear-gradient(90deg, var(--color-unavailable), #f87171);
        }

        .summary-time {
            font-size: var(--text-lg);
            font-family: var(--font-mono);
            color: var(--color-text-secondary);
            margin-bottom: var(--spacing-md);
        }

        .task-breakdown {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-xs);
        }

        .task-item {
            display: flex;
            justify-content: space-between;
            padding: var(--spacing-sm);
            background: rgba(255, 255, 255, 0.03);
            border-radius: var(--radius-sm);
            font-size: var(--text-sm);
        }

        .empty-state {
            text-align: center;
            padding: var(--spacing-2xl);
            color: var(--color-text-muted);
        }

        /* Actions */
        .actions-section {
            display: flex;
            gap: var(--spacing-md);
            flex-wrap: wrap;
        }

        .btn-end-day {
            background: linear-gradient(135deg, #8b5cf6, #a78bfa);
            color: white;
            font-weight: 600;
            padding: var(--spacing-md) var(--spacing-lg);
            border-radius: var(--radius-md);
            border: none;
            cursor: pointer;
            transition: all var(--transition-base);
            flex: 1;
            min-width: 200px;
        }

        .btn-end-day:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        /* History Modal Content */
        .history-content {
            max-height: 60vh;
            overflow-y: auto;
        }

        .history-summary {
            background: var(--color-bg-card);
            border-radius: var(--radius-md);
            padding: var(--spacing-lg);
            margin-bottom: var(--spacing-lg);
        }

        .history-summary h3 {
            color: var(--color-primary-light);
            margin-bottom: var(--spacing-md);
        }

        .history-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: var(--spacing-md);
        }

        .history-stat {
            text-align: center;
        }

        .history-stat-value {
            font-size: var(--text-2xl);
            font-weight: 700;
            font-family: var(--font-mono);
            color: var(--color-text-primary);
        }

        .history-stat-label {
            font-size: var(--text-sm);
            color: var(--color-text-muted);
        }

        .history-day {
            background: var(--gradient-card);
            border-radius: var(--radius-md);
            padding: var(--spacing-lg);
            margin-bottom: var(--spacing-md);
        }

        .history-day-header {
            font-size: var(--text-lg);
            font-weight: 600;
            color: var(--color-text-primary);
            margin-bottom: var(--spacing-sm);
        }

        .history-day-breakdown {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: var(--spacing-sm);
            margin-top: var(--spacing-md);
        }

        .history-status-item {
            text-align: center;
            padding: var(--spacing-sm);
            background: rgba(255, 255, 255, 0.03);
            border-radius: var(--radius-sm);
        }

        /* Manage Tasks Modal Content */
        .task-management {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
        }

        .task-add-section {
            background: var(--color-bg-card);
            border-radius: var(--radius-md);
            padding: var(--spacing-lg);
        }

        .task-add-form {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
        }

        .task-list-section {
            background: var(--gradient-card);
            border-radius: var(--radius-md);
            padding: var(--spacing-lg);
        }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-sm);
        }

        .task-list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--spacing-sm);
            background: rgba(255, 255, 255, 0.03);
            border-radius: var(--radius-sm);
        }

        @media (max-width: 768px) {
            .status-selector {
                grid-template-columns: 1fr;
            }

            .timer-time {
                font-size: 3rem;
            }

            .actions-section {
                flex-direction: column;
            }

            .history-day-breakdown {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="productivity-container">
        <!-- Header -->
        <div class="productivity-header">
            <h1>Productivity Tracker</h1>
            <p>Track your daily activities and time allocation</p>
            <div style="margin-top: var(--spacing-md);">
                <a href="launcher.html" class="btn btn-secondary">← Back to Launcher</a>
            </div>
        </div>

        <!-- Controls -->
        <div class="controls-section">
            <div class="status-selector">
                <button class="status-btn available" onclick="window.productivityApp.setStatus('available')">
                    Available
                </button>
                <button class="status-btn working" onclick="window.productivityApp.setStatus('working')">
                    Working
                </button>
                <button class="status-btn unavailable" onclick="window.productivityApp.setStatus('unavailable')">
                    Unavailable
                </button>
            </div>

            <div class="task-selector">
                <label id="taskLabel">Select a task to start tracking:</label>
                <select id="taskSelect" onchange="window.productivityApp.setTask()">
                    <option value="">-- Select Task --</option>
                </select>
            </div>
        </div>

        <!-- Timer Display -->
        <div class="timer-display">
            <div class="timer-status" id="timerStatus">No status selected</div>
            <div class="timer-time" id="timerTime">00:00:00</div>
            <div class="timer-task" id="timerTask">-</div>
        </div>

        <!-- Summary -->
        <div class="summary-section">
            <h2 class="summary-title">Today's Summary</h2>
            <div class="summary-cards" id="summaryCards">
                <div class="empty-state">
                    <p>No time tracked yet today. Start tracking to see your summary!</p>
                </div>
            </div>
        </div>

        <!-- Actions -->
        <div class="actions-section">
            <button class="btn-end-day" onclick="window.productivityApp.endWorkDay()">
                🌙 End Work Day
            </button>
            <button class="btn btn-warning" onclick="window.productivityApp.toggleManageTasks()">
                ⚙️ Manage Tasks
            </button>
            <button class="btn btn-secondary" onclick="window.productivityApp.toggleHistoryView()">
                📊 View History
            </button>
            <button class="btn btn-secondary" onclick="window.productivityApp.exportData()">
                💾 Export Data
            </button>
            <button class="btn btn-secondary" onclick="document.getElementById('importFile').click()">
                📥 Import Data
            </button>
            <button class="btn btn-danger" onclick="window.productivityApp.resetData()">
                🗑️ Reset All
            </button>
            <input type="file" id="importFile" accept=".json" style="display: none;" onchange="window.productivityApp.importData(event)">
        </div>
    </div>

    <!-- History Modal -->
    <div id="historyModal" class="modal" style="display: none;">
        <div class="modal-content modal-lg">
            <div class="modal-header">
                <h2>Activity History</h2>
                <button class="modal-close" onclick="window.productivityApp.toggleHistoryView()">×</button>
            </div>
            <div class="modal-body history-content" id="historyContent">
                <!-- Populated by JavaScript -->
            </div>
        </div>
    </div>

    <!-- Manage Tasks Modal -->
    <div id="tasksModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Manage Tasks</h2>
                <button class="modal-close" onclick="window.productivityApp.toggleManageTasks()">×</button>
            </div>
            <div class="modal-body">
                <div class="task-management">
                    <div class="task-add-section">
                        <h3 style="margin-bottom: var(--spacing-md); color: var(--color-primary-light);">Add New Task</h3>
                        <div class="task-add-form">
                            <div class="form-group">
                                <label class="form-label">Status</label>
                                <select id="newTaskStatus" class="form-select">
                                    <option value="working">Working</option>
                                    <option value="unavailable">Unavailable</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Task Name</label>
                                <input type="text" id="newTaskName" class="form-input" placeholder="Enter task name" onkeypress="if(event.key==='Enter') window.productivityApp.addTask()">
                            </div>
                            <button class="btn btn-primary" onclick="window.productivityApp.addTask()">Add Task</button>
                        </div>
                    </div>

                    <div class="task-list-section">
                        <h3 style="margin-bottom: var(--spacing-md); color: var(--color-primary-light);">Current Tasks</h3>
                        <div class="task-list" id="tasksList">
                            <!-- Populated by JavaScript -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="./productivity.js"></script>
</body>
</html>
