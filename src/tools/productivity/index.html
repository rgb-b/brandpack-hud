<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productivity Tracker - Brandpack Tools</title>
    <link rel="stylesheet" href="../../shared/styles/theme.css">
    <link rel="stylesheet" href="../../shared/styles/base.css">
    <link rel="stylesheet" href="../../shared/styles/components.css">
    <style>
        body {
            min-height: 100vh;
            padding: var(--spacing-xl);
        }

        .productivity-container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* Header */
        .productivity-header {
            text-align: center;
            margin-bottom: var(--spacing-2xl);
        }

        .productivity-header h1 {
            font-size: var(--text-5xl);
            font-weight: 700;
            background: linear-gradient(135deg, var(--color-available), var(--color-working), var(--color-unavailable));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: var(--spacing-sm);
        }

        .productivity-header p {
            color: var(--color-text-secondary);
        }

        /* Controls */
        .controls-section {
            background: var(--gradient-card);
            border-radius: var(--radius-xl);
            padding: var(--spacing-lg);
            margin-bottom: var(--spacing-xl);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .status-selector {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: var(--spacing-sm);
            margin-bottom: var(--spacing-md);
        }

        .status-btn {
            padding: var(--spacing-md);
            border: 2px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.03);
            color: var(--color-text-secondary);
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: 600;
            font-size: var(--text-sm);
            transition: all var(--transition-base);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .status-btn:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.05);
        }

        .status-btn.active.available {
            background: rgba(16, 185, 129, 0.1);
            border-color: var(--color-available);
            color: var(--color-available);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.3);
        }

        .status-btn.active.working {
            background: rgba(245, 158, 11, 0.1);
            border-color: var(--color-working);
            color: var(--color-working);
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.3);
        }

        .status-btn.active.unavailable {
            background: rgba(239, 68, 68, 0.1);
            border-color: var(--color-unavailable);
            color: var(--color-unavailable);
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.3);
        }

        .task-selector {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-sm);
        }

        .task-selector label {
            font-size: var(--text-sm);
            color: var(--color-text-muted);
        }

        .task-selector select {
            padding: var(--spacing-md);
            background: var(--color-bg-card);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-md);
            color: var(--color-text-primary);
            font-size: var(--text-base);
        }

        /* Timer Display */
        .timer-display {
            background: var(--gradient-card);
            border-radius: var(--radius-xl);
            padding: var(--spacing-2xl);
            text-align: center;
            margin-bottom: var(--spacing-xl);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .timer-status {
            font-size: var(--text-sm);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: var(--spacing-sm);
        }

        .timer-time {
            font-size: 4rem;
            font-weight: 700;
            font-family: var(--font-mono);
            margin-bottom: var(--spacing-sm);
            letter-spacing: 0.05em;
        }

        .timer-task {
            font-size: var(--text-lg);
            color: var(--color-text-secondary);
        }

        /* Summary Section */
        .summary-section {
            margin-bottom: var(--spacing-xl);
        }

        .summary-title {
            font-size: var(--text-xl);
            font-weight: 700;
            color: var(--color-text-primary);
            margin-bottom: var(--spacing-md);
        }

        .summary-cards {
            display: grid;
            gap: var(--spacing-md);
        }

        .summary-card {
            background: var(--gradient-card);
            border-radius: var(--radius-lg);
            padding: var(--spacing-lg);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .summary-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-md);
        }

        .summary-status {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            font-size: var(--text-lg);
            font-weight: 600;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .status-indicator.available {
            background: var(--color-available);
            box-shadow: 0 0 10px var(--color-available);
        }

        .status-indicator.working {
            background: var(--color-working);
            box-shadow: 0 0 10px var(--color-working);
        }

        .status-indicator.unavailable {
            background: var(--color-unavailable);
            box-shadow: 0 0 10px var(--color-unavailable);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .summary-percentage {
            font-size: var(--text-2xl);
            font-weight: 700;
            font-family: var(--font-mono);
        }

        .summary-progress {
            height: 8px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: var(--radius-sm);
            overflow: hidden;
            margin-bottom: var(--spacing-md);
        }

        .summary-progress-bar {
            height: 100%;
            transition: width var(--transition-slow);
        }

        .summary-progress-bar.available {
            background: linear-gradient(90deg, var(--color-available), #34d399);
        }

        .summary-progress-bar.working {
            background: linear-gradient(90deg, var(--color-working), #fbbf24);
        }

        .summary-progress-bar.unavailable {
            background: linear-gradient(90deg, var(--color-unavailable), #f87171);
        }

        .summary-time {
            font-size: var(--text-lg);
            font-family: var(--font-mono);
            color: var(--color-text-secondary);
            margin-bottom: var(--spacing-md);
        }

        .task-breakdown {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-xs);
        }

        .task-item {
            display: flex;
            justify-content: space-between;
            padding: var(--spacing-sm);
            background: rgba(255, 255, 255, 0.03);
            border-radius: var(--radius-sm);
            font-size: var(--text-sm);
        }

        .empty-state {
            text-align: center;
            padding: var(--spacing-2xl);
            color: var(--color-text-muted);
        }

        /* Actions */
        .actions-section {
            display: flex;
            gap: var(--spacing-md);
            flex-wrap: wrap;
        }

        .btn-end-day {
            background: linear-gradient(135deg, #8b5cf6, #a78bfa);
            color: white;
            font-weight: 600;
            padding: var(--spacing-md) var(--spacing-lg);
            border-radius: var(--radius-md);
            border: none;
            cursor: pointer;
            transition: all var(--transition-base);
            flex: 1;
            min-width: 200px;
        }

        .btn-end-day:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        /* History Modal Content */
        .history-content {
            max-height: 60vh;
            overflow-y: auto;
        }

        .history-summary {
            background: var(--color-bg-card);
            border-radius: var(--radius-md);
            padding: var(--spacing-lg);
            margin-bottom: var(--spacing-lg);
        }

        .history-summary h3 {
            color: var(--color-primary-light);
            margin-bottom: var(--spacing-md);
        }

        .history-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: var(--spacing-md);
        }

        .history-stat {
            text-align: center;
        }

        .history-stat-value {
            font-size: var(--text-2xl);
            font-weight: 700;
            font-family: var(--font-mono);
            color: var(--color-text-primary);
        }

        .history-stat-label {
            font-size: var(--text-sm);
            color: var(--color-text-muted);
        }

        .history-day {
            background: var(--gradient-card);
            border-radius: var(--radius-md);
            padding: var(--spacing-lg);
            margin-bottom: var(--spacing-md);
        }

        .history-day-header {
            font-size: var(--text-lg);
            font-weight: 600;
            color: var(--color-text-primary);
            margin-bottom: var(--spacing-sm);
        }

        .history-day-breakdown {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: var(--spacing-sm);
            margin-top: var(--spacing-md);
        }

        .history-status-item {
            text-align: center;
            padding: var(--spacing-sm);
            background: rgba(255, 255, 255, 0.03);
            border-radius: var(--radius-sm);
        }

        /* Manage Tasks Modal Content */
        .task-management {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
        }

        .task-add-section {
            background: var(--color-bg-card);
            border-radius: var(--radius-md);
            padding: var(--spacing-lg);
        }

        .task-add-form {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
        }

        .task-list-section {
            background: var(--gradient-card);
            border-radius: var(--radius-md);
            padding: var(--spacing-lg);
        }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-sm);
        }

        .task-list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--spacing-sm);
            background: rgba(255, 255, 255, 0.03);
            border-radius: var(--radius-sm);
        }

        @media (max-width: 768px) {
            .status-selector {
                grid-template-columns: 1fr;
            }

            .timer-time {
                font-size: 3rem;
            }

            .actions-section {
                flex-direction: column;
            }

            .history-day-breakdown {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="productivity-container">
        <!-- Header -->
        <div class="productivity-header">
            <h1>Productivity Tracker</h1>
            <p>Track your daily activities and time allocation</p>
            <div style="margin-top: var(--spacing-md);">
                <a href="../../index.html" class="btn btn-secondary">← Back to Launcher</a>
            </div>
        </div>

        <!-- Controls -->
        <div class="controls-section">
            <div class="status-selector">
                <button class="status-btn available" onclick="window.productivityApp.setStatus('available')">
                    Available
                </button>
                <button class="status-btn working" onclick="window.productivityApp.setStatus('working')">
                    Working
                </button>
                <button class="status-btn unavailable" onclick="window.productivityApp.setStatus('unavailable')">
                    Unavailable
                </button>
            </div>

            <div class="task-selector">
                <label id="taskLabel">Select a task to start tracking:</label>
                <select id="taskSelect" onchange="window.productivityApp.setTask()">
                    <option value="">-- Select Task --</option>
                </select>
            </div>
        </div>

        <!-- Timer Display -->
        <div class="timer-display">
            <div class="timer-status" id="timerStatus">No status selected</div>
            <div class="timer-time" id="timerTime">00:00:00</div>
            <div class="timer-task" id="timerTask">-</div>
        </div>

        <!-- Summary -->
        <div class="summary-section">
            <h2 class="summary-title">Today's Summary</h2>
            <div class="summary-cards" id="summaryCards">
                <div class="empty-state">
                    <p>No time tracked yet today. Start tracking to see your summary!</p>
                </div>
            </div>
        </div>

        <!-- Actions -->
        <div class="actions-section">
            <button class="btn-end-day" onclick="window.productivityApp.endWorkDay()">
                🌙 End Work Day
            </button>
            <button class="btn btn-warning" onclick="window.productivityApp.toggleManageTasks()">
                ⚙️ Manage Tasks
            </button>
            <button class="btn btn-secondary" onclick="window.productivityApp.toggleHistoryView()">
                📊 View History
            </button>
            <button class="btn btn-secondary" onclick="window.productivityApp.exportData()">
                💾 Export Data
            </button>
            <button class="btn btn-secondary" onclick="document.getElementById('importFile').click()">
                📥 Import Data
            </button>
            <button class="btn btn-danger" onclick="window.productivityApp.resetData()">
                🗑️ Reset All
            </button>
            <input type="file" id="importFile" accept=".json" style="display: none;" onchange="window.productivityApp.importData(event)">
        </div>
    </div>

    <!-- History Modal -->
    <div id="historyModal" class="modal" style="display: none;">
        <div class="modal-content modal-lg">
            <div class="modal-header">
                <h2>Activity History</h2>
                <button class="modal-close" onclick="window.productivityApp.toggleHistoryView()">×</button>
            </div>
            <div class="modal-body history-content" id="historyContent">
                <!-- Populated by JavaScript -->
            </div>
        </div>
    </div>

    <!-- Manage Tasks Modal -->
    <div id="tasksModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Manage Tasks</h2>
                <button class="modal-close" onclick="window.productivityApp.toggleManageTasks()">×</button>
            </div>
            <div class="modal-body">
                <div class="task-management">
                    <div class="task-add-section">
                        <h3 style="margin-bottom: var(--spacing-md); color: var(--color-primary-light);">Add New Task</h3>
                        <div class="task-add-form">
                            <div class="form-group">
                                <label class="form-label">Status</label>
                                <select id="newTaskStatus" class="form-select">
                                    <option value="working">Working</option>
                                    <option value="unavailable">Unavailable</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Task Name</label>
                                <input type="text" id="newTaskName" class="form-input" placeholder="Enter task name" onkeypress="if(event.key==='Enter') window.productivityApp.addTask()">
                            </div>
                            <button class="btn btn-primary" onclick="window.productivityApp.addTask()">Add Task</button>
                        </div>
                    </div>

                    <div class="task-list-section">
                        <h3 style="margin-bottom: var(--spacing-md); color: var(--color-primary-light);">Current Tasks</h3>
                        <div class="task-list" id="tasksList">
                            <!-- Populated by JavaScript -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Storage utility
        const storage = {
            get(key, defaultValue = null) {
                try {
                    const item = localStorage.getItem(key)
                    if (item === null) return defaultValue
                    return JSON.parse(item)
                } catch (error) {
                    console.error(`Error reading from localStorage [${key}]:`, error)
                    return defaultValue
                }
            },
            set(key, value) {
                try {
                    localStorage.setItem(key, JSON.stringify(value))
                    return true
                } catch (error) {
                    console.error(`Error writing to localStorage [${key}]:`, error)
                    if (error.name === 'QuotaExceededError') {
                        console.error('localStorage quota exceeded. Consider clearing old data.')
                    }
                    return false
                }
            },
            remove(key) {
                try {
                    localStorage.removeItem(key)
                } catch (error) {
                    console.error(`Error removing from localStorage [${key}]:`, error)
                }
            }
        }

        // Datetime utilities
        function formatDate(date = new Date()) {
            const year = date.getFullYear()
            const month = String(date.getMonth() + 1).padStart(2, '0')
            const day = String(date.getDate()).padStart(2, '0')
            return `${year}-${month}-${day}`
        }

        function formatDuration(seconds) {
            const hours = Math.floor(seconds / 3600)
            const minutes = Math.floor((seconds % 3600) / 60)
            const secs = seconds % 60
            return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(secs).padStart(2, '0')}`
        }

        // Constants
        const STORAGE_KEYS = {
            TASKS: 'tasks',
            HISTORY: 'history',
            DAILY_TOTALS: 'dailyTotalsByDate',
            TASK_TOTALS: 'taskTotals'
        }

        const STATUS_CATEGORIES = {
            AVAILABLE: 'available',
            WORKING: 'working',
            UNAVAILABLE: 'unavailable'
        }

        // State
        let state = {
            currentStatus: null,
            currentTask: null,
            startTime: null,
            tasks: {
                working: ['Admin', 'Maintenance'],
                unavailable: ['Lunch break', 'Tea break', 'Bathroom', 'Personal']
            },
            history: [],
            dailyTotalsByDate: {},
            taskTotals: {}
        }

        let timerInterval = null

        // Initialize
        function init() {
            migrateOldData()
            ensureTodayExists()
            loadData()
            checkForActiveSession()
            updateTaskSelect()
            updateSummary()
        }

        // Migrate old data format
        function migrateOldData() {
            const oldDailyTotals = storage.get('dailyTotals')
            if (oldDailyTotals && !storage.get(STORAGE_KEYS.DAILY_TOTALS)) {
                const today = new Date().toISOString().split('T')[0]
                state.dailyTotalsByDate = { [today]: oldDailyTotals }
                storage.remove('dailyTotals')
            }
        }

        // Ensure today's date exists in dailyTotalsByDate
        function ensureTodayExists() {
            const today = new Date().toISOString().split('T')[0]
            if (!state.dailyTotalsByDate[today]) {
                state.dailyTotalsByDate[today] = {
                    available: 0,
                    working: 0,
                    unavailable: 0
                }
            }
        }

        // Load data from localStorage
        function loadData() {
            state.tasks = storage.get(STORAGE_KEYS.TASKS, state.tasks)
            state.history = storage.get(STORAGE_KEYS.HISTORY, [])
            state.dailyTotalsByDate = storage.get(STORAGE_KEYS.DAILY_TOTALS, {})
            state.taskTotals = storage.get(STORAGE_KEYS.TASK_TOTALS, {})

            ensureTodayExists()
        }

        // Save data to localStorage
        function saveData() {
            storage.set(STORAGE_KEYS.TASKS, state.tasks)
            storage.set(STORAGE_KEYS.HISTORY, state.history)
            storage.set(STORAGE_KEYS.DAILY_TOTALS, state.dailyTotalsByDate)
            storage.set(STORAGE_KEYS.TASK_TOTALS, state.taskTotals)
        }

        // Check for active session on load
        function checkForActiveSession() {
            const activeSession = storage.get('activeSession')
            if (activeSession) {
                state.currentStatus = activeSession.status
                state.currentTask = activeSession.task
                state.startTime = activeSession.startTime

                // Update UI
                updateStatusButtons()
                updateTaskSelect()
                startTimer()
            }
        }

        // Save active session
        function saveActiveSession() {
            if (state.currentStatus && state.currentTask && state.startTime) {
                storage.set('activeSession', {
                    status: state.currentStatus,
                    task: state.currentTask,
                    startTime: state.startTime
                })
            }
        }

        // Clear active session
        function clearActiveSession() {
            storage.remove('activeSession')
        }

        // Set status
        function setStatus(status) {
            // Save previous session if exists
            if (state.currentStatus && state.currentTask && state.startTime) {
                saveSession()
            }

            state.currentStatus = status
            state.currentTask = null
            state.startTime = null

            stopTimer()
            updateStatusButtons()
            updateTaskSelect()
            clearActiveSession()

            // Auto-start for available status
            if (status === STATUS_CATEGORIES.AVAILABLE) {
                state.currentTask = 'Available'
                state.startTime = Date.now()
                startTimer()
                saveActiveSession()
            }
        }

        // Set task
        function setTask() {
            const taskSelect = document.getElementById('taskSelect')
            const selectedTask = taskSelect.value

            if (!selectedTask) return

            // Save previous session if exists
            if (state.currentTask && state.startTime) {
                saveSession()
            }

            state.currentTask = selectedTask
            state.startTime = Date.now()
            startTimer()
            saveActiveSession()
        }

        // Start timer
        function startTimer() {
            stopTimer() // Clear any existing interval

            timerInterval = setInterval(() => {
                updateTimerDisplay()
            }, 100) // Update every 100ms for smooth display

            updateTimerDisplay()
        }

        // Stop timer
        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval)
                timerInterval = null
            }
        }

        // Update timer display
        function updateTimerDisplay() {
            if (!state.startTime) {
                document.getElementById('timerStatus').textContent = 'No status selected'
                document.getElementById('timerTime').textContent = '00:00:00'
                document.getElementById('timerTask').textContent = '-'
                return
            }

            const elapsed = Date.now() - state.startTime
            const seconds = Math.floor(elapsed / 1000)
            const minutes = Math.floor(seconds / 60)
            const hours = Math.floor(minutes / 60)

            const displayHours = String(hours).padStart(2, '0')
            const displayMinutes = String(minutes % 60).padStart(2, '0')
            const displaySeconds = String(seconds % 60).padStart(2, '0')

            document.getElementById('timerStatus').textContent = state.currentStatus.toUpperCase()
            document.getElementById('timerTime').textContent = `${displayHours}:${displayMinutes}:${displaySeconds}`
            document.getElementById('timerTask').textContent = state.currentTask || '-'
        }

        // Update status buttons
        function updateStatusButtons() {
            const buttons = document.querySelectorAll('.status-btn')
            buttons.forEach(btn => {
                btn.classList.remove('active')
                if (btn.textContent.toLowerCase().trim() === state.currentStatus) {
                    btn.classList.add('active')
                }
            })
        }

        // Update task select
        function updateTaskSelect() {
            const taskSelect = document.getElementById('taskSelect')
            const taskLabel = document.getElementById('taskLabel')

            taskSelect.innerHTML = '<option value="">-- Select Task --</option>'

            if (!state.currentStatus) {
                taskSelect.disabled = true
                taskLabel.textContent = 'Select a status first'
                return
            }

            if (state.currentStatus === STATUS_CATEGORIES.AVAILABLE) {
                taskSelect.disabled = true
                taskLabel.textContent = 'Available - Auto-tracking'
                return
            }

            taskSelect.disabled = false
            taskLabel.textContent = 'Select a task to start tracking:'

            const tasks = state.tasks[state.currentStatus] || []
            tasks.forEach(task => {
                const option = document.createElement('option')
                option.value = task
                option.textContent = task
                taskSelect.appendChild(option)
            })

            // Select current task if active
            if (state.currentTask) {
                taskSelect.value = state.currentTask
            }
        }

        // Save session
        function saveSession() {
            if (!state.currentStatus || !state.currentTask || !state.startTime) return

            const duration = Date.now() - state.startTime
            const today = new Date().toISOString().split('T')[0]

            // Add to history
            state.history.push({
                status: state.currentStatus,
                task: state.currentTask,
                startTime: state.startTime,
                duration: duration,
                date: today
            })

            // Update daily totals
            ensureTodayExists()
            state.dailyTotalsByDate[today][state.currentStatus] += duration

            // Update task totals
            const taskKey = `${state.currentStatus}-${state.currentTask}`
            state.taskTotals[taskKey] = (state.taskTotals[taskKey] || 0) + duration

            saveData()
            updateSummary()
        }

        // Update summary
        function updateSummary() {
            const today = new Date().toISOString().split('T')[0]
            const todayTotals = state.dailyTotalsByDate[today] || { available: 0, working: 0, unavailable: 0 }

            const total = todayTotals.available + todayTotals.working + todayTotals.unavailable

            if (total === 0) {
                document.getElementById('summaryCards').innerHTML = `
                    <div class="empty-state">
                        <p>No time tracked yet today. Start tracking to see your summary!</p>
                    </div>
                `
                return
            }

            const statuses = [
                { key: 'available', label: 'Available', color: 'available' },
                { key: 'working', label: 'Working', color: 'working' },
                { key: 'unavailable', label: 'Unavailable', color: 'unavailable' }
            ]

            let html = ''

            statuses.forEach(({ key, label, color }) => {
                const statusTime = todayTotals[key]
                if (statusTime === 0) return

                const percentage = ((statusTime / total) * 100).toFixed(1)
                const hours = Math.round((statusTime / (1000 * 60 * 60)) * 10) / 10

                // Get task breakdown for this status
                const taskBreakdown = []
                for (const [taskKey, taskTime] of Object.entries(state.taskTotals)) {
                    const [taskStatus, taskName] = taskKey.split('-')
                    if (taskStatus === key && taskTime > 0) {
                        // Check if task has time today
                        const todayTaskTime = state.history
                            .filter(h => h.date === today && h.status === key && h.task === taskName)
                            .reduce((sum, h) => sum + h.duration, 0)

                        if (todayTaskTime > 0) {
                            const taskHours = Math.round((todayTaskTime / (1000 * 60 * 60)) * 10) / 10
                            taskBreakdown.push({ name: taskName, time: taskHours })
                        }
                    }
                }

                html += `
                    <div class="summary-card">
                        <div class="summary-card-header">
                            <div class="summary-status">
                                <span class="status-indicator ${color}"></span>
                                ${label}
                            </div>
                            <div class="summary-percentage">${percentage}%</div>
                        </div>
                        <div class="summary-progress">
                            <div class="summary-progress-bar ${color}" style="width: ${percentage}%"></div>
                        </div>
                        <div class="summary-time">${hours}h total</div>
                        ${taskBreakdown.length > 0 ? `
                            <div class="task-breakdown">
                                ${taskBreakdown.map(t => `
                                    <div class="task-item">
                                        <span>${t.name}</span>
                                        <span>${t.time}h</span>
                                    </div>
                                `).join('')}
                            </div>
                        ` : ''}
                    </div>
                `
            })

            document.getElementById('summaryCards').innerHTML = html
        }

        // End work day
        function endWorkDay() {
            if (!confirm('End work day? This will save your current session and reset tracking.')) return

            // Save current session if active
            if (state.currentStatus && state.currentTask && state.startTime) {
                saveSession()
            }

            // Clear active session
            state.currentStatus = null
            state.currentTask = null
            state.startTime = null
            stopTimer()
            clearActiveSession()

            // Reset UI
            updateStatusButtons()
            updateTaskSelect()
            updateTimerDisplay()
            updateSummary()

            alert('✓ Work day ended. See you tomorrow!')
        }

        // Toggle manage tasks modal
        function toggleManageTasks() {
            const modal = document.getElementById('tasksModal')
            const isVisible = modal.style.display === 'flex'

            if (isVisible) {
                modal.style.display = 'none'
            } else {
                modal.style.display = 'flex'
                renderTasksList()
            }
        }

        // Render tasks list
        function renderTasksList() {
            const container = document.getElementById('tasksList')

            let html = ''

            const statuses = [
                { key: 'working', label: 'Working', color: 'working' },
                { key: 'unavailable', label: 'Unavailable', color: 'unavailable' }
            ]

            statuses.forEach(({ key, label }) => {
                const tasks = state.tasks[key] || []

                html += `
                    <div style="margin-bottom: var(--spacing-md);">
                        <h4 style="color: var(--color-${key}); margin-bottom: var(--spacing-sm);">${label}</h4>
                        ${tasks.map(task => `
                            <div class="task-list-item">
                                <span>${task}</span>
                                <button class="btn btn-danger btn-small" onclick="window.productivityApp.deleteTask('${key}', '${task}')">
                                    Delete
                                </button>
                            </div>
                        `).join('')}
                    </div>
                `
            })

            container.innerHTML = html
        }

        // Add task
        function addTask() {
            const statusSelect = document.getElementById('newTaskStatus')
            const nameInput = document.getElementById('newTaskName')

            const status = statusSelect.value
            const name = nameInput.value.trim()

            if (!name) {
                alert('Please enter a task name')
                return
            }

            if (!state.tasks[status]) {
                state.tasks[status] = []
            }

            if (state.tasks[status].includes(name)) {
                alert('Task already exists')
                return
            }

            state.tasks[status].push(name)
            saveData()
            updateTaskSelect()
            renderTasksList()
            nameInput.value = ''

            alert(`✓ Task "${name}" added to ${status}`)
        }

        // Delete task
        function deleteTask(status, name) {
            if (!confirm(`Delete task "${name}"?`)) return

            state.tasks[status] = state.tasks[status].filter(t => t !== name)
            saveData()
            updateTaskSelect()
            renderTasksList()
        }

        // Toggle history view
        function toggleHistoryView() {
            const modal = document.getElementById('historyModal')
            const isVisible = modal.style.display === 'flex'

            if (isVisible) {
                modal.style.display = 'none'
            } else {
                modal.style.display = 'flex'
                renderHistoryView()
            }
        }

        // Render history view
        function renderHistoryView() {
            const container = document.getElementById('historyContent')

            // Calculate all-time stats
            const daysTracked = Object.keys(state.dailyTotalsByDate).length
            const totalMs = Object.values(state.dailyTotalsByDate).reduce((sum, day) => {
                return sum + day.available + day.working + day.unavailable
            }, 0)
            const totalHours = Math.round((totalMs / (1000 * 60 * 60)) * 10) / 10
            const avgHours = daysTracked > 0 ? Math.round((totalHours / daysTracked) * 10) / 10 : 0

            let html = `
                <div class="history-summary">
                    <h3>All-Time Statistics</h3>
                    <div class="history-stats">
                        <div class="history-stat">
                            <div class="history-stat-value">${daysTracked}</div>
                            <div class="history-stat-label">Days Tracked</div>
                        </div>
                        <div class="history-stat">
                            <div class="history-stat-value">${totalHours}</div>
                            <div class="history-stat-label">Total Hours</div>
                        </div>
                        <div class="history-stat">
                            <div class="history-stat-value">${avgHours}</div>
                            <div class="history-stat-label">Avg Hours/Day</div>
                        </div>
                    </div>
                </div>
            `

            // Sort dates descending
            const sortedDates = Object.keys(state.dailyTotalsByDate).sort((a, b) => b.localeCompare(a))

            sortedDates.forEach(date => {
                const dayTotals = state.dailyTotalsByDate[date]
                const dayTotal = dayTotals.available + dayTotals.working + dayTotals.unavailable

                if (dayTotal === 0) return

                const dateObj = new Date(date + 'T00:00:00')
                const formattedDate = dateObj.toLocaleDateString('en-AU', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })

                const availablePercent = ((dayTotals.available / dayTotal) * 100).toFixed(1)
                const workingPercent = ((dayTotals.working / dayTotal) * 100).toFixed(1)
                const unavailablePercent = ((dayTotals.unavailable / dayTotal) * 100).toFixed(1)

                const availableHours = Math.round((dayTotals.available / (1000 * 60 * 60)) * 10) / 10
                const workingHours = Math.round((dayTotals.working / (1000 * 60 * 60)) * 10) / 10
                const unavailableHours = Math.round((dayTotals.unavailable / (1000 * 60 * 60)) * 10) / 10

                html += `
                    <div class="history-day">
                        <div class="history-day-header">${formattedDate}</div>
                        <div class="history-day-breakdown">
                            <div class="history-status-item">
                                <div style="color: var(--color-available); font-weight: 700; font-size: var(--text-xl);">${availablePercent}%</div>
                                <div style="color: var(--color-text-muted); font-size: var(--text-sm);">Available</div>
                                <div style="color: var(--color-text-secondary); font-size: var(--text-sm);">${availableHours}h</div>
                            </div>
                            <div class="history-status-item">
                                <div style="color: var(--color-working); font-weight: 700; font-size: var(--text-xl);">${workingPercent}%</div>
                                <div style="color: var(--color-text-muted); font-size: var(--text-sm);">Working</div>
                                <div style="color: var(--color-text-secondary); font-size: var(--text-sm);">${workingHours}h</div>
                            </div>
                            <div class="history-status-item">
                                <div style="color: var(--color-unavailable); font-weight: 700; font-size: var(--text-xl);">${unavailablePercent}%</div>
                                <div style="color: var(--color-text-muted); font-size: var(--text-sm);">Unavailable</div>
                                <div style="color: var(--color-text-secondary); font-size: var(--text-sm);">${unavailableHours}h</div>
                            </div>
                        </div>
                    </div>
                `
            })

            if (sortedDates.length === 0) {
                html += '<div class="empty-state"><p>No history data available</p></div>'
            }

            container.innerHTML = html
        }

        // Export data
        function exportData() {
            const exportObj = {
                tasks: state.tasks,
                history: state.history,
                dailyTotalsByDate: state.dailyTotalsByDate,
                taskTotals: state.taskTotals,
                exportDate: new Date().toISOString()
            }

            const dataStr = JSON.stringify(exportObj, null, 2)
            const dataBlob = new Blob([dataStr], { type: 'application/json' })
            const url = URL.createObjectURL(dataBlob)
            const link = document.createElement('a')
            const today = new Date().toISOString().split('T')[0]
            link.href = url
            link.download = `productivity_backup_${today}.json`
            document.body.appendChild(link)
            link.click()
            document.body.removeChild(link)
            URL.revokeObjectURL(url)

            alert('✓ Data exported successfully!')
        }

        // Import data
        function importData(event) {
            const file = event.target.files[0]
            if (!file) return

            const reader = new FileReader()
            reader.onload = (e) => {
                try {
                    const importedData = JSON.parse(e.target.result)

                    // Merge tasks
                    if (importedData.tasks) {
                        Object.keys(importedData.tasks).forEach(status => {
                            if (!state.tasks[status]) {
                                state.tasks[status] = []
                            }
                            importedData.tasks[status].forEach(task => {
                                if (!state.tasks[status].includes(task)) {
                                    state.tasks[status].push(task)
                                }
                            })
                        })
                    }

                    // Merge history
                    if (Array.isArray(importedData.history)) {
                        state.history = [...state.history, ...importedData.history]
                    }

                    // Merge daily totals
                    if (importedData.dailyTotalsByDate) {
                        Object.keys(importedData.dailyTotalsByDate).forEach(date => {
                            if (!state.dailyTotalsByDate[date]) {
                                state.dailyTotalsByDate[date] = { available: 0, working: 0, unavailable: 0 }
                            }
                            Object.keys(importedData.dailyTotalsByDate[date]).forEach(status => {
                                state.dailyTotalsByDate[date][status] += importedData.dailyTotalsByDate[date][status]
                            })
                        })
                    }

                    // Merge task totals
                    if (importedData.taskTotals) {
                        Object.keys(importedData.taskTotals).forEach(key => {
                            state.taskTotals[key] = (state.taskTotals[key] || 0) + importedData.taskTotals[key]
                        })
                    }

                    saveData()
                    updateTaskSelect()
                    updateSummary()

                    alert('✓ Data imported and merged successfully!')
                } catch (error) {
                    alert('Error importing data. Please check the file format.')
                    console.error(error)
                }
            }
            reader.readAsText(file)

            // Reset file input
            event.target.value = ''
        }

        // Reset data
        function resetData() {
            if (!confirm('⚠️ Reset ALL data? This will delete all history, tasks, and totals. This cannot be undone!')) return
            if (!confirm('Are you absolutely sure? This will permanently delete everything!')) return

            // Clear state
            state.currentStatus = null
            state.currentTask = null
            state.startTime = null
            state.tasks = {
                working: ['Admin', 'Maintenance'],
                unavailable: ['Lunch break', 'Tea break', 'Bathroom', 'Personal']
            }
            state.history = []
            state.dailyTotalsByDate = {}
            state.taskTotals = {}

            // Clear localStorage
            storage.remove(STORAGE_KEYS.TASKS)
            storage.remove(STORAGE_KEYS.HISTORY)
            storage.remove(STORAGE_KEYS.DAILY_TOTALS)
            storage.remove(STORAGE_KEYS.TASK_TOTALS)
            clearActiveSession()

            // Reset timer
            stopTimer()

            // Reset UI
            updateStatusButtons()
            updateTaskSelect()
            updateTimerDisplay()
            updateSummary()

            alert('✓ All data has been reset.')
        }

        // Initialize app
        function initApp() {
            init()

            // Expose API for event handlers
            window.productivityApp = {
                setStatus,
                setTask,
                endWorkDay,
                toggleManageTasks,
                addTask,
                deleteTask,
                toggleHistoryView,
                exportData,
                importData,
                resetData
            }
        }

        // Run on DOM ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initApp)
        } else {
            initApp()
        }
    </script>
</body>
</html>
