<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brandpack Tools - Loading...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #0a0e1a 0%, #0f1419 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loader-container {
            text-align: center;
        }

        .logo {
            font-size: 3rem;
            margin-bottom: 1rem;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.05); }
        }

        h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #ff6b35, #ff8c42, #ffa600);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        p {
            color: #94a3b8;
            font-size: 1.1rem;
        }

        .spinner {
            margin: 2rem auto;
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 140, 66, 0.1);
            border-top: 4px solid #ff8c42;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .manual-link {
            margin-top: 2rem;
            padding: 1rem 2rem;
            background: rgba(255, 140, 66, 0.1);
            border: 2px solid rgba(255, 140, 66, 0.3);
            border-radius: 12px;
            display: none;
        }

        .manual-link a {
            color: #ff8c42;
            text-decoration: none;
            font-weight: 600;
        }

        .manual-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="loader-container">
        <div class="logo">🚀</div>
        <h1>Brandpack Tools</h1>
        <p>Loading Dashboard...</p>
        <div class="spinner"></div>
        <div class="manual-link" id="manualLink">
            <p>Taking too long? <a href="./src/tools/launcher/index.html">Click here to load manually</a></p>
        </div>
    </div>

    <script>
        // Redirect to the main dashboard
        window.location.href = './src/tools/launcher/index.html';

        // Show manual link after 3 seconds if redirect hasn't worked
        setTimeout(() => {
            document.getElementById('manualLink').style.display = 'block';
        }, 3000);
    </script>
</body>
</html>
